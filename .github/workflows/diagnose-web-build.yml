name: Diagnose web build

# Temporary Phase 17 instrument. Manually dispatched, or pushed to a disposable `diagnose/**`
# branch. Never runs on `main` or a phase branch, and is deleted once the silent `next build` exit
# on Linux is understood. It changes nothing about the product; it runs the same command CI runs,
# with every diagnostic Node and Next expose at the pinned versions.
#
# Everything after the install lives in one step under `set +e`, so a failing probe cannot stop the
# probes after it. The job's own result is meaningless; only its log matters.

on:
  workflow_dispatch:
  push:
    branches: ["diagnose/**"]

permissions:
  contents: read

env:
  NODE_VERSION: "24.14.1"
  PNPM_VERSION: "10.33.0"

jobs:
  diagnose:
    name: Reproduce the silent next build exit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Probe
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set +e
          banner() { echo; echo "############ $* ############"; echo; }

          banner ENVIRONMENT
          uname -a; node --version; pnpm --version; nproc; free -m; df -h .
          grep PRETTY /etc/os-release
          ( cd apps/web && node -p "require('next/package.json').version" )
          ( cd apps/web && node -p "require('typescript/package.json').version" )
          ls -d node_modules/.pnpm/@next+swc* 2>/dev/null || echo "no @next/swc packages installed"
          ls -d node_modules/.pnpm/sharp* 2>/dev/null || echo "no sharp installed"
          env | grep -iE 'node|next|npm|pnpm|^CI=|turbo' | sort

          banner "WORKSPACE BUILD, WEB AND ROOT EXCLUDED"
          pnpm -r --if-present --filter '!@flightrules/web' --filter '!flightrules' run build
          echo "workspace build exit=$?"

          banner "APPS/WEB TYPECHECK ALONE"
          ( cd apps/web && pnpm run typecheck ); echo "typecheck exit=$?"

          banner "NEXT BUILD UNDER --trace-exit"
          cd apps/web
          NEXT_BIN="$(node -p "require.resolve('next/dist/bin/next')")"
          echo "next bin: $NEXT_BIN"
          NODE_OPTIONS="--trace-exit --trace-uncaught --trace-warnings" \
            node "$NEXT_BIN" build > /tmp/b.out 2> /tmp/b.err
          echo "=== next build exit code: $? ==="
          echo "--- stdout ---"; cat /tmp/b.out
          echo "--- stderr ---"; cat /tmp/b.err
          echo "--- end ---"

          banner "WHAT THE BUILD LEFT IN .next"
          ls -la .next 2>/dev/null || echo "no .next"
          find .next -maxdepth 2 2>/dev/null | head -60

          banner "PLAIN NEXT BUILD, EXIT CODE ONLY"
          rm -rf .next
          next build; echo "raw exit=$?"

          banner "NEXT BUILD WITH NEXT_PRIVATE_DEBUG"
          rm -rf .next
          NEXT_PRIVATE_DEBUG_CACHE=1 DEBUG='next:*' next build 2>&1 | tail -80
          echo "debug exit=${PIPESTATUS[0]}"

          banner "WEBPACK BUILDER FOR COMPARISON"
          rm -rf .next
          next build --webpack 2>&1 | tail -60
          echo "webpack exit=${PIPESTATUS[0]}"

          banner DMESG
          sudo dmesg 2>/dev/null | tail -40 || echo "dmesg unavailable"

          exit 0
