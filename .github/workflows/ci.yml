name: CI

on:
  push:
    branches: ["main", "phase/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.14.1"
  PNPM_VERSION: "10.33.0"

jobs:
  static:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Built on its own, first. `pnpm run -r build` multiplexes every package's output and drops a
      # child's stderr when it exits immediately, which turned the first real CI run's web-build
      # failure into the single word "Failed" with no diagnosis. Running this package alone keeps
      # its stderr attached.
      - name: Build the web application
        run: pnpm --filter @flightrules/web run build

      - name: Build
        run: pnpm run build

  unit:
    name: Unit and property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      # Every workspace package resolves through its `exports`, which point at `dist/`. Nothing is
      # built by installing, so without this the suite fails at import with
      # `Failed to resolve entry for package "@flightrules/telemetry"`. Locally `dist/` is always
      # warm, which is why this only appeared on the first real CI run.
      - name: Build the workspace packages the suite imports
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test

  database:
    name: Database integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flightrules
          POSTGRES_PASSWORD: flightrules
          POSTGRES_DB: flightrules
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U flightrules -d flightrules"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://flightrules:flightrules@localhost:5433/flightrules
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      # The migrator runs from source through `tsx` and imports `@flightrules/domain` by its package
      # entry point, which resolves to `dist/`. Nothing is built in this job, so without this the
      # migration steps fail with ERR_MODULE_NOT_FOUND. `make db-migrate` does the same locally.
      # The whole workspace, not just the migrator: the integration suite imports packages by
      # their `exports`, which point at `dist/`.
      - name: Build
        run: pnpm run build

      - name: Apply migrations
        run: pnpm --filter @flightrules/db run migrate

      - name: Revert most recent migration
        run: pnpm --filter @flightrules/db run rollback

      - name: Reapply migrations
        run: pnpm --filter @flightrules/db run migrate

      - name: Database integration tests
        run: pnpm run test:integration:db

  signoz:
    name: SigNoz deployment and MCP integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install foundryctl
        run: |
          curl -fsSL https://signoz.io/foundry.sh | FOUNDRY_VERSION=v0.2.16 bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify the casting reproduces and every image is pinned
        run: bash scripts/verify-reproducibility.sh

      - name: Deploy the pinned SigNoz stack
        run: foundryctl cast -f casting.yaml --format text --no-ledger --no-updater

      - name: Bootstrap SigNoz and mint an API key
        run: bash scripts/bootstrap-signoz.sh
        env:
          # Compliant with SigNoz's password policy by construction: at least 12 characters
          # with an uppercase letter, a lowercase letter, a digit and a symbol. `ci-<run_id>`
          # alone has neither an uppercase letter nor a symbol, so registration returned HTTP
          # 400 and this job could never have passed.
          SIGNOZ_ADMIN_PASSWORD: ${{ format('Ci-{0}-Aa1!', github.run_id) }}

      - name: Verify every SigNoz surface
        run: bash scripts/verify-signoz.sh

      - name: Refresh the MCP capability snapshot and assert every required tool exists
        run: |
          set -a; . ./.env; set +a
          node scripts/snapshot-mcp-capabilities.mjs "$RUNNER_TEMP/mcp-capabilities.json"

      - name: SigNoz integration tests
        run: |
          set -a; . ./.env; set +a
          pnpm run test:integration:signoz

      - name: Tear down
        if: always()
        run: docker compose -f pours/deployment/compose.yaml -p signoz down -v

  security:
    name: Secret, licence and dependency scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm run scan:secrets

      - name: Dependency licence check
        run: pnpm run scan:licences

      - name: Dependency vulnerability audit
        run: pnpm run scan:deps

  clean-install:
    name: Clean install from committed manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install with no cache, lockfile only
        run: pnpm install --frozen-lockfile --prefer-offline=false

      - name: Verify the lockfile was not modified by installing
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Build from a clean tree
        run: pnpm run build
