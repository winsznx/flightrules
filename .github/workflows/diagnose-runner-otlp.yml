name: Diagnose runner OTLP path

# Temporary Phase 17 instrument. Manually dispatched, or pushed to a disposable `diagnose/**`
# branch. Never runs on `main` or a phase branch, and is deleted once the question it asks is
# answered. It changes nothing about the product.
#
# What the last run established: on a runner the five demo services' server spans reach SigNoz and
# the demo agent's spans never do, so the release filter matches nothing and every suite that needs
# a run fails. The agent still returns a real trace identifier, so its tracer is alive.
#
# This run separates the two remaining explanations: the agent's context never reaches the services
# (its SDK is inert) or it does and only its export fails.

on:
  workflow_dispatch:
  push:
    branches: ["diagnose/**"]

permissions:
  contents: read

env:
  NODE_VERSION: "24.14.1"
  PNPM_VERSION: "10.33.0"
  FOUNDRY_VERSION: "v0.2.16"

jobs:
  diagnose:
    name: Why the agent's spans do not arrive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install foundryctl
        run: |
          curl -fsSL https://signoz.io/foundry.sh | FOUNDRY_VERSION="${FOUNDRY_VERSION}" bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cast the deployment
        run: foundryctl cast -f casting.yaml --format text --no-ledger --no-updater

      - name: Bootstrap SigNoz
        run: bash scripts/bootstrap-signoz.sh
        env:
          SIGNOZ_ADMIN_PASSWORD: ${{ format('Ci-{0}-{1}-Aa1!', github.run_id, github.run_attempt) }}

      - name: Probe
        run: |
          set +e
          banner() { echo; echo "############ $* ############"; echo; }

          banner "START THE DEMO TOPOLOGY"
          docker compose -f compose.app.yaml up -d --build --wait \
            policy-service order-service fraud-service payment-service notification-service demo-agent

          banner "AGENT CONTAINER: RESOLUTION, ENVIRONMENT, AND A DIRECT OTLP POST"
          docker compose -f compose.app.yaml exec -T demo-agent sh -c \
            'getent hosts host.docker.internal; echo "endpoint=$OTEL_EXPORTER_OTLP_ENDPOINT"; echo "env=$DEPLOYMENT_ENVIRONMENT_NAME"'
          docker compose -f compose.app.yaml exec -T demo-agent node -e '
            fetch(`${process.env.OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces`,{method:"POST",
              headers:{"content-type":"application/json"},body:"{\"resourceSpans\":[]}"})
              .then(r=>console.log("agent OTLP post status",r.status))
              .catch(e=>console.log("agent OTLP post ERROR",e.name,e.message,e.cause&&e.cause.code));'

          banner "ONE RUN, AND THE TRACE ID IT CLAIMS"
          set -a; . ./.env; set +a
          RUN_JSON="$(curl -sf --max-time 60 -X POST http://localhost:4100/agent/refund \
            -H 'Content-Type: application/json' \
            -d '{"releaseId":"refund-agent-v1","orderId":"ord-98271"}')"
          TRACE_ID="$(printf '%s' "$RUN_JSON" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).traceId')"
          echo "agent reported traceId=$TRACE_ID"

          banner "AGENT LOGS SINCE START"
          docker compose -f compose.app.yaml logs --no-log-prefix demo-agent | tail -60

          banner "WAIT, THEN ASK SIGNOZ WHAT IT HOLDS"
          sleep 60
          node scripts/probe-spans.mjs
          echo "query exit=$?"

          banner "COLLECTOR LOGS, FILTERED FOR REFUSALS"
          docker logs "$(docker ps --filter name=ingester --format '{{.Names}}' | head -1)" 2>&1 \
            | grep -iE "error|refus|drop|reject|permanent|queue" | tail -40

          banner "TEAR DOWN"
          docker compose -f compose.app.yaml down -v || true
          docker compose -f pours/deployment/compose.yaml -p signoz down -v || true
          exit 0
