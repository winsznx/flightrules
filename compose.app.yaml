# FlightRules application services.
#
# SigNoz is deployed separately by Foundry from casting.yaml (see docs/RUNBOOK.md); this file
# owns only what FlightRules itself runs. Keeping them apart is deliberate: PRD section 12.5
# forbids inventing custom Foundry moldings to smuggle application services into the SigNoz
# deployment.
#
# The PostgreSQL port is 5433 on the host so it cannot collide with the SigNoz metastore or a
# developer's own local PostgreSQL.

name: flightrules

networks:
  flightrules-network:
    name: flightrules-network

volumes:
  flightrules-postgres-data:

services:
  postgres:
    image: postgres:16
    container_name: flightrules-postgres
    environment:
      POSTGRES_USER: flightrules
      POSTGRES_PASSWORD: flightrules
      POSTGRES_DB: flightrules
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5433:5432"
    volumes:
      - flightrules-postgres-data:/var/lib/postgresql/data
    networks:
      - flightrules-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightrules -d flightrules"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  policy-service:
    build:
      context: .
      dockerfile: Dockerfile.demo
      args:
        SERVICE_PATH: apps/demo-services/policy-service
    container_name: flightrules-policy-service
    environment:
      PORT: "4101"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT_INTERNAL:-http://host.docker.internal:4318}"
      DEPLOYMENT_ENVIRONMENT_NAME: "${DEPLOYMENT_ENVIRONMENT_NAME:-local}"
      NODE_ENV: production
    ports:
      - "4101:4101"
    networks:
      - flightrules-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.demo
      args:
        SERVICE_PATH: apps/demo-services/order-service
    container_name: flightrules-order-service
    environment:
      PORT: "4102"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT_INTERNAL:-http://host.docker.internal:4318}"
      DEPLOYMENT_ENVIRONMENT_NAME: "${DEPLOYMENT_ENVIRONMENT_NAME:-local}"
      NODE_ENV: production
    ports:
      - "4102:4102"
    networks:
      - flightrules-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  fraud-service:
    build:
      context: .
      dockerfile: Dockerfile.demo
      args:
        SERVICE_PATH: apps/demo-services/fraud-service
    container_name: flightrules-fraud-service
    environment:
      PORT: "4103"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT_INTERNAL:-http://host.docker.internal:4318}"
      DEPLOYMENT_ENVIRONMENT_NAME: "${DEPLOYMENT_ENVIRONMENT_NAME:-local}"
      NODE_ENV: production
    ports:
      - "4103:4103"
    networks:
      - flightrules-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4103/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.demo
      args:
        SERVICE_PATH: apps/demo-services/payment-service
    container_name: flightrules-payment-service
    environment:
      PORT: "4104"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT_INTERNAL:-http://host.docker.internal:4318}"
      DEPLOYMENT_ENVIRONMENT_NAME: "${DEPLOYMENT_ENVIRONMENT_NAME:-local}"
      NODE_ENV: production
      DEMO_MODE: "${DEMO_MODE:-true}"
      IDEMPOTENCY_HASH_SALT: "${IDEMPOTENCY_HASH_SALT:?IDEMPOTENCY_HASH_SALT must be set in .env}"
      PAYMENT_SLOW_RESPONSE_MS: "${PAYMENT_SLOW_RESPONSE_MS:-2500}"
    ports:
      - "4104:4104"
    networks:
      - flightrules-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4104/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.demo
      args:
        SERVICE_PATH: apps/demo-services/notification-service
    container_name: flightrules-notification-service
    environment:
      PORT: "4105"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT_INTERNAL:-http://host.docker.internal:4318}"
      DEPLOYMENT_ENVIRONMENT_NAME: "${DEPLOYMENT_ENVIRONMENT_NAME:-local}"
      NODE_ENV: production
      DEMO_MODE: "${DEMO_MODE:-true}"
    ports:
      - "4105:4105"
    networks:
      - flightrules-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4105/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  demo-agent:
    build:
      context: .
      dockerfile: Dockerfile.demo
      args:
        SERVICE_PATH: apps/demo-agent
    container_name: flightrules-demo-agent
    environment:
      PORT: "4100"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT_INTERNAL:-http://host.docker.internal:4318}"
      DEPLOYMENT_ENVIRONMENT_NAME: "${DEPLOYMENT_ENVIRONMENT_NAME:-local}"
      NODE_ENV: production
      DEMO_MODE: "${DEMO_MODE:-true}"
      POLICY_SERVICE_URL: http://policy-service:4101
      ORDER_SERVICE_URL: http://order-service:4102
      FRAUD_SERVICE_URL: http://fraud-service:4103
      PAYMENT_SERVICE_URL: http://payment-service:4104
      NOTIFICATION_SERVICE_URL: http://notification-service:4105
      PAYMENT_TIMEOUT_MS: "${PAYMENT_TIMEOUT_MS:-800}"
    ports:
      - "4100:4100"
    networks:
      - flightrules-network
    depends_on:
      policy-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      fraud-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
