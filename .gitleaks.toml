# gitleaks configuration.
#
# `secretlint` is the gate that runs in CI and scans the working tree. gitleaks is the
# supplementary scan Phase 16 adds, because it walks **git history** — and a secret that was
# committed once and removed in the next commit is still published the moment the repository is
# made public.
#
# Everything below is an allowlist entry, and every one of them is a false positive that was
# inspected individually. The point of writing them down is that 45 known-benign findings make a
# real one invisible: a scan whose output is always noisy is a scan nobody reads.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

[rules.allowlist]
regexTarget = "match"
paths = [
  # The exported release-gate evidence. Its 40 findings are all `"ruleKey": "require-fraud-check-4dccc488"`
  # — a FlightRules rule identifier with its content-hash suffix. The bundle is generated by
  # `flightrules evidence export`, which runs every value through `packages/domain/src/redaction.ts`
  # before writing, and a test asserts no prompt or tool payload survives that path.
  '''docs/evidence/.*\.json''',

  # `agent.idempotency.key_hash` in a fixture: a salted SHA-256 of an idempotency key. Emitting the
  # hash rather than the key is the deliberate privacy control (PRD section 17.6), so the thing this
  # rule matches is the control working.
  '''packages/baseline-miner/src/emit\.test\.ts''',

  # The redaction tests themselves. Both files contain deliberately credential-shaped strings,
  # because a test that a secret is redacted has to contain something shaped like a secret.
  '''packages/domain/src/redaction\.test\.ts''',
  '''packages/telemetry/src/logs\.test\.ts''',
]
